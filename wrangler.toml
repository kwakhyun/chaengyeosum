name = "chaengyeosum-api"
main = "worker/index.mjs"
compatibility_date = "2026-07-28"
workers_dev = true

[assets]
directory = "./worker-assets"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "AI_EGRESS"
class_name = "OpenAiEgress"

[exports.OpenAiEgress]
type = "durable-object"
storage = "sqlite"

[[d1_databases]]
binding = "DB"
database_name = "chaengyeosum-prod"
database_id = "34b930b5-4d62-4071-aa86-967e9331b6d2"
migrations_dir = "migrations"

# 매일 04:17 KST(19:17 UTC)에 오래된 모임·캐시·사용량 기록을 정리해요.
[triggers]
crons = ["17 19 * * *"]

# AI 브리핑·여름 행사 검색이 함께 쓰는 서비스 전체 하루 OpenAI 호출 한도예요.
# 1 이상 정수가 아니면 코드 기본값(600)을 써요.
[vars]
AI_GLOBAL_DAILY_LIMIT = "600"
